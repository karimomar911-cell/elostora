services:
  - type: static
    name: franchise-service-app
    env: static
    branch: main
    buildCommand: npm install && npm run build
    publishPath: dist
    rootDir: .
    envVars:
      - key: VITE_SUPABASE_URL
        value: ""
      - key: VITE_SUPABASE_ANON_KEY
        value: ""
      - key: VITE_DEV_PASSWORD
        value: ""
